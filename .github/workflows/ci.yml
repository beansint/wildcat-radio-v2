name: CI

# Fast feedback for development; coverage/build run for main or on demand.
# Feature handoff does not wait for remote CI. See docs/testing/verification-policy.md.

on:
  pull_request:
    branches: [dev, main]
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [dev, main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      full:
        description: Run coverage and the production build
        type: boolean
        default: true

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # `next build` reads the API origin, which now throws in production
      # rather than falling back to a wrong port. CI is not production, but the
      # build still needs a syntactically valid origin to prerender against.
      NEXT_PUBLIC_API_URL: http://localhost:3010
      NEXT_PUBLIC_SITE_URL: http://localhost:3011

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        if: github.ref != 'refs/heads/main' && github.base_ref != 'main' && !(github.event_name == 'workflow_dispatch' && inputs.full)
        run: pnpm run test:unit

      - name: Unit tests + coverage (full validation)
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main' || (github.event_name == 'workflow_dispatch' && inputs.full)
        run: pnpm run test:coverage

      - name: Production build (full validation)
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main' || (github.event_name == 'workflow_dispatch' && inputs.full)
        run: pnpm run build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject high and critical dependency advisories
        run: pnpm audit --audit-level high
