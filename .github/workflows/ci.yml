name: CI

# Development CI keeps the fast quality checks. Run Playwright explicitly
# when browser verification is needed: pnpm test:e2e.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · unit tests + coverage · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # `next build` reads the API origin, which now throws in production
      # rather than falling back to a wrong port. CI is not production, but the
      # build still needs a syntactically valid origin to prerender against.
      NEXT_PUBLIC_API_URL: http://localhost:3010
      NEXT_PUBLIC_SITE_URL: http://localhost:3011

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests + coverage
        # Report-only for now (#72): no thresholds until a baseline exists.
        # The v8 report prints in the job log on every PR.
        run: pnpm run test:coverage

      - name: Build
        # Last, because it is the slowest and the cheaper gates above catch
        # most of what would fail here.
        run: pnpm run build
